[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openzilo-gesture"
version = "0.2.0"
description = "Portable six-axis IMU gesture recognition with exported HMM models"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "hmmlearn>=0.3.3,<0.4",
]

[project.urls]
Source = "https://github.com/ziloai/OpenZilo-Gesture"
Issues = "https://github.com/ziloai/OpenZilo-Gesture/issues"

[tool.uv.workspace]
members = ["studio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openzilo_gesture = ["py.typed"]
