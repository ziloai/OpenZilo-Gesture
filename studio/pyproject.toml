[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openzilo-gesture-studio"
version = "0.2.0"
description = "Desktop ring gesture recording, training and export platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
  "openzilo-gesture==0.2.0",
  "sounddevice>=0.5,<0.6",
  "PySide6-Essentials>=6.9,<6.12",  # 6.12 aborts at exit on Python 3.10
  "pyqtgraph>=0.13.7,<0.15",
  "openzilo[pcm]>=0.6.3,<0.7",
]

[project.scripts]
openzilo-gesture-studio = "openzilo_gesture_studio.launcher:main"
openzilo-gesture-studio-legacy = "openzilo_gesture_studio.gui:main"
openzilo-gesture-train = "openzilo_gesture_studio.training:main"

[tool.uv.sources]
openzilo-gesture = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openzilo_gesture_studio = ["qt/locales/*.json"]
